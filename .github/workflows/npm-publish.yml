# Publishes to npmjs.org (as the unscoped "faster-browser-agent") both on a
# manually created GitHub Release and automatically whenever package.json's
# version changes on main — a push to main covers a PR merge too, since a
# merge produces a push event. The version check makes the two triggers safe
# to keep side by side: whichever fires first publishes, the other sees the
# version already published and skips instead of failing.
#
# workflow_dispatch is a manual escape hatch: it goes through the Actions API
# directly rather than the repo's check-suite auto-trigger path, so it still
# works even if that path is misbehaving for push events.
name: Publish to npm

on:
  release:
    types: [created]
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch: {}

# Three triggers can fire for one version, and the version check below is
# check-then-act: two runs that overlap both read "not published yet" and both
# try, so the loser dies on E403. Serialising them means the second run sees the
# first one's publish and skips cleanly.
#
# The group is deliberately constant, NOT keyed on github.ref. auto-tag-release
# turns every version bump on main into a GitHub Release, which fires this
# workflow a second time — and a release event carries refs/tags/vX.Y.Z while
# the push carried refs/heads/main, so a ref-keyed group would put the two runs
# in different groups and serialise nothing. Publishing a package is a global
# mutex; the ref that triggered it is irrelevant.
#
# cancel-in-progress stays false deliberately — killing a run mid-publish is
# worse than waiting for it.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # The suite includes real-browser integration tests; a bare runner has
      # no Chromium, so `npm test` fails without this.
      - run: npx playwright-core install --with-deps chromium
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - name: Publish only if the version actually changed
        env:
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}
        run: |
          LOCAL_VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED_VERSION="$(npm view faster-browser-agent version 2>/dev/null || true)"
          echo "local: $LOCAL_VERSION — published: ${PUBLISHED_VERSION:-<none>}"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "version unchanged, skipping publish"
            exit 0
          fi

          # The concurrency group above already serialises the common case. This
          # is the backstop for what it cannot cover — a re-run of an old run, or
          # the registry lagging behind its own write. Publishing a version that
          # already exists is the outcome we wanted, not a failure.
          set +e
          OUTPUT="$(npm publish 2>&1)"
          STATUS=$?
          set -e
          echo "$OUTPUT"

          if [ $STATUS -ne 0 ]; then
            if echo "$OUTPUT" | grep -qi "cannot publish over the previously published version"; then
              echo "$LOCAL_VERSION was already published by a concurrent run — treating as success"
            else
              exit $STATUS
            fi
          fi
