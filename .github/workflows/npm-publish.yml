# Publishes to npmjs.org as the unscoped "faster-browser-agent".
#
# This workflow no longer decides *when* to publish. auto-tag-release.yml owns
# that: it detects the version bump, creates the tag and release, and only then
# calls this workflow. That ordering is the point — a published version that has
# no tag behind it is a version nobody can find the source for.
#
# It is reached two ways and no others:
#   workflow_call     — from auto-tag-release, after the tag exists
#   workflow_dispatch — manual escape hatch, e.g. to re-publish after a
#                       registry outage
#
# The former `release: [created]` trigger was removed as dead code: the release
# is created with GITHUB_TOKEN, and GitHub deliberately does not start workflow
# runs from events raised by that token, so it could never have fired.
name: Publish to npm

on:
  workflow_call: {}
  workflow_dispatch: {}

# Constant, not keyed on github.ref: publishing a package is a global mutex and
# the ref that triggered it is irrelevant. cancel-in-progress stays false —
# killing a run mid-publish is worse than queueing behind it.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # The suite includes real-browser integration tests; a bare runner has
      # no Chromium, so `npm test` fails without this.
      - run: npx playwright-core install --with-deps chromium
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - name: Publish only if the version actually changed
        env:
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}
        run: |
          LOCAL_VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED_VERSION="$(npm view faster-browser-agent version 2>/dev/null || true)"
          echo "local: $LOCAL_VERSION — published: ${PUBLISHED_VERSION:-<none>}"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "version unchanged, skipping publish"
            exit 0
          fi

          # Kept even though the caller already gates on a version bump: a
          # manual dispatch, or a re-run of an old run, can still arrive at an
          # already-published version. Publishing something that already exists
          # is the outcome we wanted, not a failure.
          set +e
          OUTPUT="$(npm publish 2>&1)"
          STATUS=$?
          set -e
          echo "$OUTPUT"

          if [ $STATUS -ne 0 ]; then
            if echo "$OUTPUT" | grep -qi "cannot publish over the previously published version"; then
              echo "$LOCAL_VERSION was already published by a concurrent run — treating as success"
            else
              exit $STATUS
            fi
          fi
