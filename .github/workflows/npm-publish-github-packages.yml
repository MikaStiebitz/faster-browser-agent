# Publishes a scoped mirror of this package to GitHub Packages
# (@mikastiebitz/faster-browser-agent).
#
# GitHub Packages only resolves the npm registry override for SCOPED package
# names (@owner/name); this package's public npmjs.org name is unscoped
# (faster-browser-agent, see npm-publish.yml). Without a scope, npm silently
# falls back to the default registry.npmjs.org and publish fails there
# unauthenticated. The rename below only touches the ephemeral checkout on the
# runner, never the committed package.json.
#
# Like npm-publish.yml, this no longer decides when to publish —
# auto-tag-release.yml calls it after the tag exists. Reached via
# workflow_call and workflow_dispatch only.
name: Publish to GitHub Packages

on:
  workflow_call: {}
  workflow_dispatch: {}

# See npm-publish.yml: constant group, publishing is a global mutex.
concurrency:
  group: publish-gpr
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # The suite includes real-browser integration tests; a bare runner has
      # no Chromium, so `npm test` fails without this.
      - run: npx playwright-core install --with-deps chromium
      - run: npm test

  publish-gpr:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/
          scope: '@mikastiebitz'
          always-auth: true
      - run: npm ci
      - name: Rename to the scoped GitHub Packages name
        run: npm pkg set name=@mikastiebitz/faster-browser-agent
      - name: Publish only if the version actually changed
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOCAL_VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED_VERSION="$(npm view @mikastiebitz/faster-browser-agent version 2>/dev/null || true)"
          echo "local: $LOCAL_VERSION — published: ${PUBLISHED_VERSION:-<none>}"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "version unchanged, skipping publish"
            exit 0
          fi

          # Backstop for what the caller's gate cannot cover — see the same
          # step in npm-publish.yml.
          set +e
          OUTPUT="$(npm publish 2>&1)"
          STATUS=$?
          set -e
          echo "$OUTPUT"

          if [ $STATUS -ne 0 ]; then
            if echo "$OUTPUT" | grep -qiE "cannot publish over the previously published version|already exists"; then
              echo "$LOCAL_VERSION was already published by a concurrent run — treating as success"
            else
              exit $STATUS
            fi
          fi
