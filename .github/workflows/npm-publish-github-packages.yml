# Publishes a scoped mirror of this package to GitHub Packages
# (@mikastiebitz/faster-browser-agent) whenever package.json's version on
# main actually changes.
#
# GitHub Packages only resolves the npm registry override for SCOPED package
# names (@owner/name); this package's public npmjs.org name is unscoped
# (faster-browser-agent, see npm-publish.yml). Without a scope, npm silently
# falls back to the default registry.npmjs.org and publish fails there
# unauthenticated — that was the original bug here. The fix is to publish a
# second, GitHub-Packages-only name under the owner's scope; the rename below
# only touches the ephemeral checkout on the runner, never the committed
# package.json.
# workflow_dispatch is a manual escape hatch: it goes through the Actions API
# directly rather than the repo's check-suite auto-trigger path, so it still
# works even if that path is misbehaving for push events.
name: Publish to GitHub Packages

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # The suite includes real-browser integration tests; a bare runner has
      # no Chromium, so `npm test` fails without this.
      - run: npx playwright-core install --with-deps chromium
      - run: npm test

  publish-gpr:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/
          scope: '@mikastiebitz'
          always-auth: true
      - run: npm ci
      - name: Rename to the scoped GitHub Packages name
        run: npm pkg set name=@mikastiebitz/faster-browser-agent
      - name: Publish only if the version actually changed
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOCAL_VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED_VERSION="$(npm view @mikastiebitz/faster-browser-agent version 2>/dev/null || true)"
          echo "local: $LOCAL_VERSION — published: ${PUBLISHED_VERSION:-<none>}"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "version unchanged, skipping publish"
          else
            npm publish
          fi
