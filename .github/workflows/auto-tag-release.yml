# The single entry point for shipping a version.
#
# One push to main with a changed package.json version produces, in order:
#   1. a vX.Y.Z tag and a GitHub Release, with an auto-generated changelog
#   2. a publish to npmjs.org
#   3. a publish to GitHub Packages
#
# Ordering is the point. Publishing first and tagging second can leave a
# version on a registry that has no tag behind it — nobody can find the source
# for it. Tag first, publish after, and a failed tag stops the whole thing.
#
# The publishes are reached with `workflow_call`, not by listening for the
# release event. GitHub deliberately does not start workflow runs from events
# raised by GITHUB_TOKEN, so a release created here could never trigger
# anything; a `release:` trigger on the publish workflows was dead code. A PAT
# would work around that, but calling directly needs no extra secret and keeps
# the whole sequence visible in one run.
#
# Repeat pushes with no version bump are a safe no-op: the tag check short
# circuits, and nothing downstream runs.
name: Auto Tag Release

on:
  push:
    branches: [main]
    # A version bump always touches package.json, so this loses nothing —
    # including bumps folded into a larger commit or a merge, since the filter
    # matches if *any* changed file matches. It stops the workflow from waking
    # on every docs commit only to no-op.
    paths: ['package.json']
  workflow_dispatch: {}

# Constant, like the publish workflows: this is a release mutex, and the ref
# that triggered it is irrelevant.
concurrency:
  group: auto-tag-release
  cancel-in-progress: false

jobs:
  tag-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # Whether this run actually created a tag — the gate for everything below.
      released: ${{ steps.check.outputs.exists == 'false' }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version and tag
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if this version was already tagged
        id: check
        run: |
          if git ls-remote --tags origin | grep -qE "refs/tags/${{ steps.version.outputs.tag }}$"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.version.outputs.tag }} already exists — nothing to release"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${{ steps.version.outputs.tag }} is new — will tag, release and publish"
          fi

      - name: Build changelog since previous tag
        if: steps.check.outputs.exists == 'false'
        id: changelog
        run: |
          PREV_TAG="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          if [ -n "$PREV_TAG" ]; then
            echo "previous tag: $PREV_TAG"
            RANGE="$PREV_TAG..HEAD"
          else
            echo "no previous tag, using full history"
            RANGE="HEAD"
          fi

          {
            echo "changelog<<CHANGELOG_EOF"
            echo "## What's Changed"
            echo ""
            git log "$RANGE" --no-merges --pretty=format:'- %s (%h)'
            echo ""
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "${{ steps.changelog.outputs.changelog }}" \
            --target "${{ github.sha }}"

  # Only after the tag exists. Both publishes still re-check the version
  # themselves, so a manual dispatch of either one stays safe on its own.
  publish-npm:
    needs: tag-release
    if: needs.tag-release.outputs.released == 'true'
    uses: ./.github/workflows/npm-publish.yml
    permissions:
      contents: read
    secrets: inherit

  publish-github-packages:
    needs: tag-release
    if: needs.tag-release.outputs.released == 'true'
    uses: ./.github/workflows/npm-publish-github-packages.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
